name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev,renderer,agent]'
      - run: ruff check .
      - run: pytest --cov=src --cov-report=term-missing

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/control.Dockerfile -t agentic-manim-control:test .
      - run: docker build -f docker/agent-worker.Dockerfile -t agentic-manim-agent:test .
      - run: docker build -f docker/render-control.Dockerfile -t agentic-manim-render-control:test .
      - run: docker build -f docker/runtime.Dockerfile -t agentic-manim-runtime:test .
      - run: docker compose config -q
      - run: docker run --rm agentic-manim-control:test python -c "import importlib.util; assert importlib.util.find_spec('pydantic') is None"
      - run: docker run --rm agentic-manim-render-control:test python -c "import importlib.util; assert importlib.util.find_spec('pydantic') is None"
      - run: docker run --rm agentic-manim-agent:test python -c "import langgraph, pydantic"
