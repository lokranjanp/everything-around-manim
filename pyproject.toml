[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-manim"
version = "0.1.0"
description = "Local-first agentic Manim video generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docker>=7.1,<8",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1.2,<2",
  "litestar>=2.24,<3",
  "msgspec>=0.19,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
